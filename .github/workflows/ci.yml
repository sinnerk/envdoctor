name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an older run irrelevant; cancel it instead of queueing work
# behind a stalled runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A hosted runner can wedge (seen once on ubuntu-latest: go vet never returned
    # and the job sat for 45 minutes). Fail in minutes, not in most of an hour.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # No third-party dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        # Explicit timeout so a hanging test reports as a test failure with a
        # stack dump instead of waiting for the job timeout.
        run: go test -timeout 5m ./...

      - name: build
        run: go build ./...

  smoke:
    name: audit a clean runner
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: build
        run: go build -o envdoctor.exe ./cmd/envdoctor

      - name: run
        shell: pwsh
        run: |
          .\envdoctor.exe --no-color --fast
          .\envdoctor.exe --json --redact --fast | Out-File report.json -Encoding utf8
          $report = Get-Content report.json -Raw | ConvertFrom-Json
          "score=$($report.score) grade=$($report.grade) checks=$($report.checks)"

      - uses: actions/upload-artifact@v4
        with:
          name: envdoctor-report
          path: report.json
